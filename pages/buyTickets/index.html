<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchiTix</title>
    <link rel="stylesheet" href="../../global/styles.css" />
    <link rel="stylesheet" href="buy.css" />
    <link rel="icon" type="image/jpeg" href="../../assets/icon.jpg" />
  </head>
  <body>
    <header>
      <img src="../../assets/9.png" alt="ArchiTix Logo" />
      <nav>
        <a href="../../index.html" class="nonCurrent">Home</a>
        <a href="../../pages/features/index.html" class="nonCurrent"
          >Features</a
        >
        <a href="../../pages/buyTickets/index.html" id="current">Buy Tickets</a>
        <a href="../../pages/sellTickets/index.html" class="nonCurrent"
          >Sell Tickets</a
        >
        <a href="../../pages/about/index.html" class="nonCurrent">About Us</a>
      </nav>
      <div id="profileBorder">
        <img
          src="../../assets/pfp.png"
          alt="Profile Picture"
          id="pfp"
          onclick="profileAlert()"
        />
      </div>
    </header>
    <main>
      <article>
        <div>
          <div id="glow"></div>
          <h1>Buy Tickets</h1>
        </div>
        <section>
          <div class="filters">
            <div class="filter-wrapper">
              <span class="filter-icon"
                ><img src="../../assets/filter.png" alt=""
              /></span>
              <select name="filter" id="eventFilter">
                <option>Price – Low to High</option>
                <option>Price – High to Low</option>
                <option>Newest First</option>
                <option>Oldest First</option>
              </select>
            </div>
            <div class="search-wrapper">
              <input type="text" placeholder="Search Event" />
              <span class="search-icon"
                ><img src="../../assets/search.png" alt=""
              /></span>
            </div>
          </div>
          <div class="events">
            <div class="showing">
              <h2>Now Showing</h2>
              <div id="events"></div>
            </div>
            <div class="upcoming">
              <h2>Upcoming</h2>
              <div id="events"></div>
            </div>
          </div>
        </section>
      </article>
    </main>
    <hr />
    <footer>
      <img src="../../assets/facebook.png" alt="Facebook Icon" />
      <img src="../../assets/instagram.png" alt="Instagram Icon" />
      <img src="../../assets/twitter.png" alt="Twitter Icon" />
      <img src="../../assets/youtube.png" alt="Youtube Icon" />
    </footer>
    <div id="mouseGlow"></div>
    <script src="buy.js"></script>
    <script src="../../global/script.js"></script>
  </body>
</html>
